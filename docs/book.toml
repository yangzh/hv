[book]
title = "Kongming HV Documentation"
authors = ["Kevin Yang"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/yangzh/hv"
edit-url-template = "https://github.com/yangzh/hv/edit/main/docs/src/{path}"
site-url = "/hv/"
no-section-label = true
default-theme = "light"
preferred-dark-theme = "ayu"
additional-css = ["theme/tabs.css", "theme/last-changed.css", "theme/callouts.css", "theme/figure.css"]
additional-js = ["theme/tabs.js", "theme/sponsor.js"]

[output.html.search]
enable = true

[output.html.fold]
enable = true          # collapsible sidebar sections (default is off)
level = 1              # keep the top level open, fold deeper sections

[preprocessor.last-changed]
command = "mdbook-last-changed"
renderer = ["html"]

[preprocessor.katex]
renderers = ["html", "pdf"]

[preprocessor.tabs]

# TODO: re-enable when mdbook-linkcheck supports mdbook 0.5+
# [output.linkcheck]
# warning-policy = "warn"

[output.pdf]
title = "Kongming HV Documentation"
# mdbook-pdf's own retry path is DEAD CODE at the default: trying_times = 1
# makes `for time in 1..(1+1)` a single pass, and the first error then hits
# `if time == trying_times` and panics without ever retrying. 3 buys two real
# retries, with a 1s and 2s backoff, against a transient Chrome print collision.
trying-times = 3
