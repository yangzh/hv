name: Deploy docs

on:
  push:
    # Deploy docs only when a release tag lands (synced from primary).
    # Raw markdown on main may be ahead of the deployed site — this is
    # intentional so the published docs stay in lockstep with PyPI.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # PINNED deliberately -- do not restore ubuntu-latest. mdbook-pdf 0.1.13
    # bundles an old headless_chrome that collides with the Chrome in 26.04 and
    # dies with "-32000 Page is already being printed". v11.0.0's docs deploy
    # failed the moment ubuntu-latest rolled 24.04 -> 26.04; this file and
    # book.toml were byte-identical to v10.0.0, which passed on 24.04. Re-pin
    # only together with an mdbook-pdf upgrade, and watch the PDF step.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install mdBook and plugins
        run: |
          mkdir -p $HOME/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C $HOME/bin
          curl -sSL -o $HOME/bin/mdbook-pdf https://github.com/HollowMan6/mdbook-pdf/releases/download/v0.1.13/mdbook-pdf-v0.1.13-x86_64-unknown-linux-gnu \
            && chmod +x $HOME/bin/mdbook-pdf
          curl -sSL https://github.com/lzanini/mdbook-katex/releases/download/0.10.0-alpha-binaries/mdbook-katex-v0.10.0-alpha-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C $HOME/bin
          curl -sSL https://github.com/RustForWeb/mdbook-plugins/releases/download/v1.0.4/mdbook-tabs-v1.0.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C $HOME/bin
          curl -sSL https://github.com/badboy/mdbook-last-changed/releases/download/v0.4.0/mdbook-last-changed-v0.4.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C $HOME/bin
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Install tab assets
        run: cd docs && mdbook-tabs install
      - name: Build docs
        # mdbook finishes the html backend and writes it to disk BEFORE the pdf
        # backend starts, so a broken pdf renderer need not cost us the site.
        # It did once: v11.0.0 shipped to PyPI while the published docs stayed
        # on v10.0.0, because the pdf panicked after the html had been written.
        # The html book is required; the PDF is a site asset, not a gate.
        run: |
          if ! mdbook build docs; then
            echo "::warning::mdbook reported a failure -- continuing only if the HTML book was written"
          fi
          test -f docs/book/html/index.html
      - name: Copy PDF into HTML site
        run: |
          if [ -f docs/book/pdf/output.pdf ]; then
            cp docs/book/pdf/output.pdf docs/book/html/kongming-hv.pdf
          else
            echo "::warning::no PDF produced; deploying HTML without refreshing kongming-hv.pdf"
          fi
      - name: Include demos
        run: |
          if [ -d demo ]; then
            mkdir -p docs/book/html/demo
            cp -r demo/. docs/book/html/demo/
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
